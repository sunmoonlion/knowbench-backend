[project]
name = "knowbench-backend"
version = "2.0.0"
description = "Admin 与 Web 共用的生产级 FastAPI 后端模板"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "joserfc>=1.7.3,<2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "redis>=6.4.0",
    "celery>=5.5.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=13,<18",
    "boto3==1.43.66",
    # 读用户的数据（SDD 0042，从 knowlab 搬来）：PDF 抽文字、Excel 读格子
    "pdfplumber>=0.11,<0.12",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pyright>=1.1.400",
    "ruff",
    "duckdb==1.5.5",
    # 只有测试与评测用同步连接建库；产品代码用 asyncpg
    "psycopg[binary]>=3.3.4",
    "import-linter>=2.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingModuleSource = false
reportOptionalMemberAccess = true
reportAttributeAccessIssue = true
include = ["app", "core", "scripts"]
exclude = ["alembic"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"app/interfaces/endpoints/**" = ["B008"]

# 工程结构的自动检查。规则见 k8s 仓 `tree-build/SDD/architecture/engineering.md`「工程结构」。
# 跑法：`uv run lint-imports`；`tests/test_layering.py` 也会跑它，所以分层没守住，`pytest` 就不过。
# `ignore_imports` 是旧账的放行清单：还掉一条就删一条。清单里写的引用已经不存在时，检查会报错，逼着删。
[tool.importlinter]
root_packages = ["app", "core"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "domain-imports-nothing-outside"
name = "领域层不引用任何外层"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.interfaces",
    "app.bootstrap",
    "app.tasks",
    "app.cli",
    "core",
]

[[tool.importlinter.contracts]]
id = "application-not-outer-layers"
name = "应用层不引用基础设施层、接口层、组装层"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure",
    "app.interfaces",
    "app.bootstrap",
    "app.tasks",
    "app.cli",
]
# 旧账的放行清单：只减不增，还掉一条删一条。
ignore_imports = [
    # 模板带来的（三个后端一样）：可靠投递的旧路径，只为部署目录里的集成测试留着。账本 H15。
    "app.application.services.durable_tasks -> app.infrastructure.messaging.durable_tasks",
]

[[tool.importlinter.contracts]]
id = "interface-surfaces-independent"
name = "接口层的三个面互不引用"
type = "independence"
modules = [
    "app.interfaces.http.admin",
    "app.interfaces.http.web",
    "app.interfaces.http.internal",
]

[[tool.importlinter.contracts]]
id = "inner-layers-no-io-libraries"
name = "应用层与领域层不直接引用数据库、网络、消息这类库"
type = "forbidden"
source_modules = ["app.application", "app.domain"]
forbidden_modules = [
    "sqlalchemy",
    "asyncpg",
    "psycopg",
    "redis",
    "celery",
    "kombu",
    "httpx",
    "requests",
    "aiohttp",
    "websockets",
    "fastapi",
    "starlette",
    "boto3",
    "botocore",
    "minio",
    "elasticsearch",
    "pymongo",
    "neo4j",
    "pika",
    "aio_pika",
    "sqlite3",
]
allow_indirect_imports = true
